# FusionCompute Zabbix 监控配置
# 依据 FusionCompute 8.6.0 VRM REST 接口文档 03

[vrm]
# VRM 节点管理 IP 或域名（不要带 https:// 前缀）
host = 192.168.1.10
# VRM 端口，默认 7443
port = 7443
# 协议：正常环境用 https（VRM 只支持 https）；仅本地测试可改 http
scheme = https
# 登录账号（建议使用有只读权限的对接账户）
username = admin
# 登录密码（脚本会自动做 SHA-256 加密后传输，无需在此预加密）
password = ChangeMe123

# ---- 接口版本（最容易配错的一项，务必看注释）----
# 这里的 version 是「接口版本」，不是产品版本！查《VRM接口文档 03》1.2：
#     接口版本 6.3 -> FusionCompute 6.3.0 / 6.3.1
#     接口版本 6.5 -> FusionCompute 6.5.0 / 6.5.1
#     接口版本 8.0 -> FusionCompute 8.0.0 / 8.0.0.SPC1 / 8.0.1
#     接口版本 8.1 -> FusionCompute 8.1.0 或更高版本（8.2/8.6/8.8 都用 8.1）
# 所以 FusionCompute 8.6.0 的局点要填 8.1。
# 填 8.6.0 会被 VRM 直接拒绝：
#     HTTP 400 {"errorCode":"10000022","errorDes":"版本号错误"}
# 填 auto 则每次先 GET /service/versions 自动协商（多一次请求，最省心）。
version = 8.1

# 请求超时（秒）
timeout = 10
# 是否校验 HTTPS 证书。VRM 默认自签名证书，填 false；如需校验填 CA 证书文件路径
verify = false
# token 缓存：true 时 10 分钟内复用有效 token，只登录一次（虚拟机多时建议保持 true）。
# 缓存文件在系统临时目录 fc_token_<hash>.json，权限 600，按 VRM 地址+账号区分。
token_cache = true
# 排障用：true 时把每个请求/响应的原始内容打到 stderr（等价于命令行 --debug）
# debug = false

[zabbix]
# Trapper 模式：zabbix_server 地址（server 或 proxy）
# 留空则使用 zabbix_sender 的 agent 配置文件（主动式 agent）
server =
# Zabbix 中监控此 FusionCompute 的主机名（模板挂载的主机）
host = FusionCompute-VRM
# zabbix_sender 二进制路径（外部检查模式可忽略）
sender_bin = zabbix_sender
# 主动式 agent 配置文件路径（server 为空时使用）
agent_conf = /etc/zabbix/zabbix_agentd.conf
