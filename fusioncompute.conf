# FusionCompute Zabbix 监控配置
# 依据 FusionCompute 8.6.0 VRM REST 接口文档

[vrm]
# VRM 节点管理 IP 或域名（不要带 https:// 前缀）
host = 192.168.1.10
# VRM 端口，默认 7443
port = 7443
# 登录账号（建议使用有只读权限的对接账户）
username = admin
# 登录密码（脚本会自动做 SHA-256 加密后传输，无需在此预加密）
password = ChangeMe123
# API 版本号，写入 Accept 头
version = 8.6.0
# 请求超时（秒）
timeout = 10
# 是否校验 HTTPS 证书。VRM 默认自签名证书，填 false；如需校验填证书文件路径
verify = false

[zabbix]
# Trapper 模式：zabbix_server 地址（server 或 proxy）
# 留空则使用 zabbix_sender 的 agent 配置文件（主动式 agent）
server =
# Zabbix 中监控此 FusionCompute 的主机名（模板挂载的主机）
host = FusionCompute-VRM
# zabbix_sender 二进制路径（外部检查模式可忽略）
sender_bin = zabbix_sender
# 主动式 agent 配置文件路径（server 为空时使用）
agent_conf = /etc/zabbix/zabbix_agentd.conf
